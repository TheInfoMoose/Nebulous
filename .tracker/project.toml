[project]
name = "Nebulous"
version = "0.1.0"
active_phase = "production"
default_scope = "inbox"
created_at = "2026-11-09T20:41:30Z"

[counters]
bug = 0
feature = 0
task = 83

[[phases.registry]]
id = "pre_production"
title = "Pre-Production"
path = "phases/pre_production"

[[phases.registry]]
id = "production"
title = "Production"
path = "phases/production"

[[phases.registry]]
id = "post_production"
title = "Post-Production"
path = "phases/post_production"

[metrics]
target_daily_hours = 6.0
stagnant_item_threshold_days = 4
max_session_minutes = 480

[git]
sync_mode = "manual"
sync_interval_minutes = 30
remote = "origin"
branch = "main"
auto_commit_on_close = false

[git.commit_policy]
require_item_id = true
require_scope = true
require_summary = true
min_summary_length = 12
auto_append_to_desc = true

