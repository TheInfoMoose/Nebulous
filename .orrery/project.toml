project_name = "Nebulous"
plan_path = "STEPPED_IMPLEMENTATION_PLAN.md"
step_marker = "### STEP "
execution_mode = "Run"
cycle_count = 0
max_concurrent_agents = 1
max_step_retries = 2
validation_mode = "Agents"
gate_tools = ["hybrid:step_check"]

[[stages]]
role_id = "orchestrator"
agent_ids = ["claude-orch"]

[[stages]]
role_id = "coder"
agent_ids = ["agy-impl"]

[[stages]]
role_id = "validator"
agent_ids = ["claude-val"]

[hooks.on_step_start]
tool = "hybrid:step_start"
on_failure = "Halt"

[limits]
mcp_call_timeout_secs = 1800
