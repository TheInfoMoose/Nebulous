name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Format, Clippy, Test & CLI Smoke Check (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            clang \
            libssl-dev \
            libdbus-1-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lint workspace (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit and integration tests (cargo test)
        run: cargo test --workspace

      - name: Verify CLI/TUI binary (nebulous_cli --help)
        run: cargo run -p nebulous_cli -- --help
