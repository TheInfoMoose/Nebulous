name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux-x86_64:
    name: Build & Package `neb` (Linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            clang \
            libssl-dev \
            libdbus-1-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Supply-chain advisory gate (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Run verification suite
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build release binary (`neb`)
        run: cargo build -p nebulous_cli --release --locked

      - name: Verify release binary (`neb --help`)
        run: ./target/release/neb --help

      - name: Package `.tar.gz` archive and `.sha256` checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE_BASENAME="nebulous-${TAG}-x86_64-unknown-linux-gnu"
          STAGING_DIR="dist/${ARCHIVE_BASENAME}"

          mkdir -p "${STAGING_DIR}"
          cp target/release/neb "${STAGING_DIR}/"
          cp README.md LICENSE "${STAGING_DIR}/"
          cp -r docs "${STAGING_DIR}/"

          tar -C dist -czf "dist/${ARCHIVE_BASENAME}.tar.gz" "${ARCHIVE_BASENAME}"
          (cd dist && sha256sum "${ARCHIVE_BASENAME}.tar.gz" > "${ARCHIVE_BASENAME}.tar.gz.sha256")

      - name: Upload release archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archive and checksum
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
