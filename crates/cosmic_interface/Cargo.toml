[package]
name = "cosmic_interface"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native libcosmic GUI (`nebulous`) for the Nebulous project and bug tracker"

[lib]
name = "cosmic_interface"
path = "src/lib.rs"

[[bin]]
name = "nebulous"
path = "src/main.rs"

[dependencies]
arboard = "3"
backend_core.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["tokio", "winit"] }

[dev-dependencies]
tempfile = "3"

